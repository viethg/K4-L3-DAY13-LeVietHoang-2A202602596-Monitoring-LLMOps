service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "SLO 99.5% fast & successful requests trong chu kỳ 28 ngày dựa trên baseline steady-state P95 latency ~435ms (ngưỡng 3000ms cho phép xử lý tail latency khi vector retrieval chậm). Error budget là 0.5%: với quy mô 10,000 requests trong 28 ngày, tối đa 50 requests được phép thất bại hoặc vượt quá 3000ms trước khi kích hoạt quy trình đóng băng release."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
